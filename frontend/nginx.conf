# Serves the single-page app and reverse-proxies the API on the same origin.
# This file is included inside nginx's http {} block, so the zones and maps below are valid here.

# Per-client-IP request limits (in front of the API's own per-IP and per-user limits).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

# HSTS only when the browser is on HTTPS: directly, or via a TLS proxy that sets
# X-Forwarded-Proto. Over plain HTTP the header is left out (browsers ignore it there anyway).
map "$scheme:$http_x_forwarded_proto" $hsts {
    default        "";
    "~^https:"     "max-age=31536000; includeSubDomains";
    "~:https$"     "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;   # invoice uploads are capped at 10 MB by the API
    client_body_timeout 30s;
    client_header_timeout 15s;

    limit_req_status 429;
    limit_req_log_level warn;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        limit_req zone=api_per_ip burst=100 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append to) the client-supplied header: nginx is the edge, so the
        # API must see only the address nginx itself observed. Otherwise anyone could pick
        # their own "IP" for rate limits and the audit log by sending X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # The API sets some of these too; send each header exactly once (a doubled
        # X-Frame-Options value can make browsers ignore it).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        # Credential endpoints: a much stricter per-IP limit.
        location ~ ^/api/v1/auth/(login|reset-password)$ {
            limit_req zone=auth_per_ip burst=20 nodelay;
            proxy_pass http://api:8000;
        }
    }

    # Hashed build assets can be cached forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Never serve dotfiles or common leftovers, even if one ends up in the web root.
    # (/api/ and /assets/ above use ^~, so this regex never shadows them.)
    location ~ /\.|\.(map|bak|old|orig|swp|sql|gz|zip|tar|env|log|ini|conf|ya?ml)$ {
        return 404;
    }

    # Client-side routes fall back to index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
