# Production-like stack: docker compose up -d --build
# Configure secrets in .env (copy .env.example, or run `make env`).
name: smart-inventory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      # Least-privilege role the app connects as (created by docker/db/10-app-role.sh).
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    # Tuned for a laptop with limited RAM.
    command: >
      postgres -c shared_buffers=128MB -c work_mem=8MB -c maintenance_work_mem=64MB
               -c max_connections=50 -c effective_cache_size=384MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    # No "ports:": the database is reachable only from the api and worker containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  api:
    build: ./backend
    image: smart-inventory-backend:latest
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      # The app's own non-superuser role when APP_DB_USER/APP_DB_PASSWORD are set (they are
      # in new .env files); older .env files keep using the admin role until migrated.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-${POSTGRES_USER:-inventory}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB:-inventory}
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m

  worker:
    image: smart-inventory-backend:latest
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      # The app's own non-superuser role when APP_DB_USER/APP_DB_PASSWORD are set (they are
      # in new .env files); older .env files keep using the admin role until migrated.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-${POSTGRES_USER:-inventory}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB:-inventory}
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      api:
        condition: service_healthy   # api applies migrations first
    mem_limit: 768m

  web:
    build: ./frontend
    image: smart-inventory-frontend:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m

  # --- Document archive (optional) ----------------------------------------------------------
  # Start with:  docker compose --profile archive up -d   (or: make archive)
  # Scans, OCRs, tags and indexes receipts, invoices, contracts and tax documents.
  # Approved supplier invoices are filed here automatically when PAPERLESS_TOKEN is set.
  archive-redis:
    image: redis:7-alpine
    profiles: ["archive"]
    restart: unless-stopped
    mem_limit: 128m

  archive:
    image: paperlessngx/paperless-ngx:3.5.1
    profiles: ["archive"]
    restart: unless-stopped
    # Show it as "Smart Inventory Documents" (title, logo, texts), then start it as usual.
    entrypoint: ["/bin/bash", "-c", "bash /brand/10-smart-inventory-brand.sh; exec /init"]
    depends_on:
      - archive-redis
    ports:
      - "${ARCHIVE_PORT:-8090}:8000"
    environment:
      PAPERLESS_REDIS: redis://archive-redis:6379
      PAPERLESS_BIND_ADDR: 0.0.0.0           # listen on IPv4 (many shop PCs have IPv6 off)
      # Required for the archive; checked by `make archive` (left optional here so stacks
      # without the archive still start with older .env files).
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-archive-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-}
      PAPERLESS_URL: ${PAPERLESS_PUBLIC_URL:-http://localhost:8090}
      # Smart Inventory reaches the archive inside Docker as http://archive:8000; the archive
      # adds the public URL's host to this list itself.
      PAPERLESS_ALLOWED_HOSTS: archive
      # Run as the owner of ./archive-inbox so filed scans can be removed from it
      # (`make archive` fills these in from the person running it).
      USERMAP_UID: ${ARCHIVE_UID:-1000}
      USERMAP_GID: ${ARCHIVE_GID:-1000}
      PAPERLESS_APP_TITLE: Smart Inventory Documents
      PAPERLESS_APP_LOGO: /logo/smart-inventory.png
      PAPERLESS_TIME_ZONE: Africa/Nairobi
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_DATE_ORDER: DMY               # Kenyan documents put the day first
      PAPERLESS_FILENAME_FORMAT: "{{ correspondent }}/{{ created_year }}/{{ title }}"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
    volumes:
      - archive-data:/usr/src/paperless/data
      - archive-media:/usr/src/paperless/media
      # A scanner (scan-to-folder) or staff can drop files here; they are read and filed.
      - ./archive-inbox:/usr/src/paperless/consume
      - ./docker/archive:/brand:ro
    mem_limit: 1536m

volumes:
  pgdata:
  storage:
  archive-data:
  archive-media:
