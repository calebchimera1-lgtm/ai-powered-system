[project]
name = "smart-inventory-backend"
version = "0.1.0"
description = "AI-Driven Smart Inventory Management and Automated Receipt Digitization System - API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"alembic/versions/**" = ["E501"]
